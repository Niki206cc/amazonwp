{% extends 'base.html' %}
{% block content %}
<div class="page-head"><div><h1>Revisione articolo</h1><p>{{ article.product_title }}</p></div><div class="actions">
<form method="post" action="{{ url_for('article_approve', article_id=article.id) }}" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap">
  <label style="margin:0">Data pubblicazione
    <input id="scheduledDateApprove" type="date" name="scheduled_date" value="{{ article.scheduled_date or '' }}" min="{{ today }}">
  </label>
  <button class="btn success">{% if article.scheduled_date %}Approva e programma{% else %}Approva e metti in coda{% endif %}</button>
</form>
<form method="post" action="{{ url_for('article_send_now', article_id=article.id) }}"><button class="btn secondary">Invio prova ora</button></form>
</div></div>
<form method="post" class="editor-layout">
  <section class="panel">
    <label>Titolo articolo<input name="title" value="{{ article.title }}"></label>
    <label>Titolo Facebook<input name="alt_title_1" value="{{ alt_titles[0] if alt_titles else '' }}"></label>
    <label>Data pubblicazione programmata
      <input id="scheduledDateEdit" type="date" name="scheduled_date" value="{{ article.scheduled_date or '' }}" min="{{ today }}">
      <small>Facoltativa. Se impostata, l'articolo non verrà pubblicato prima di questa data e partirà nella prima fascia automatica utile.</small>
    </label>
    <label>Meta description<textarea name="meta_description" rows="3">{{ article.meta_description }}</textarea></label>
    <label>Excerpt<textarea name="excerpt" rows="3">{{ article.excerpt }}</textarea></label>
    <label>HTML WordPress<textarea id="htmlEditor" name="html" rows="24">{{ article.html }}</textarea></label>
    <button class="btn" type="submit">Salva articolo</button>
  </section>
  <section class="panel preview-wrap"><h3>Anteprima</h3><iframe id="preview"></iframe></section>
</form>
<script>
const ed=document.getElementById('htmlEditor'), pv=document.getElementById('preview');
const dateApprove=document.getElementById('scheduledDateApprove'), dateEdit=document.getElementById('scheduledDateEdit');
if(dateApprove && dateEdit){
  dateApprove.addEventListener('change',()=>dateEdit.value=dateApprove.value);
  dateEdit.addEventListener('change',()=>dateApprove.value=dateEdit.value);
}
function update(){const image={{ preview_image|tojson }}; const photo=image ? '<img src="'+image.replace(/"/g,'&quot;')+'" alt="{{ article.product_title|e }}" style="display:block;max-width:100%;max-height:460px;object-fit:contain;margin:0 auto 24px">' : ''; pv.srcdoc='<meta charset="utf-8"><base target="_blank"><style>body{font:16px Arial;line-height:1.6;padding:20px}img{max-width:100%;height:auto}</style>'+photo+ed.value}
ed.addEventListener('input',update); update();
</script>
{% endblock %}
