{% extends 'base.html' %}
{% block content %}
<h1>Nuovo prodotto</h1>
<form method="post" enctype="multipart/form-data" class="panel form-grid">
  <label>Titolo<input name="title" value="{{ product.get('title','') }}" required></label>
  <label>Link Amazon<input name="amazon_url" value="{{ product.get('amazon_url','') }}"></label>
  <label>ASIN<input name="asin" value="{{ product.get('asin','') }}"></label>
  <label>Prezzo<input name="price" value="{{ product.get('price','') }}"></label>
  <label>Categoria<input name="category" value="{{ product.get('category','') }}"></label>
  <label>URL immagine<input name="image_url" value="{{ product.get('image_url','') }}"></label>
  <label class="full">Oppure carica immagine<input type="file" name="image_file" accept="image/*"></label>
  <label class="full">Caratteristiche<textarea name="features" rows="6">{{ product.get('features','') }}</textarea></label>
  <label class="full">Note<textarea name="notes" rows="4">{{ product.get('notes','') }}</textarea></label>
  <div class="full"><button class="btn" type="submit">Salva prodotto</button></div>
</form>
{% endblock %}
