<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Amazon Articoli MP{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand">Amazon Articoli MP</div>
  <nav>
    <a href="{{ url_for('index') }}">Prodotti</a>
    <a href="{{ url_for('product_new') }}">Nuovo prodotto</a>
    <a href="{{ url_for('discover') }}">Scopri prodotti</a>
    <a href="{{ url_for('queue_page') }}">Coda</a>
    <a href="{{ url_for('settings_page') }}">Impostazioni</a>
  </nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
